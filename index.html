<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Talkie">
<meta name="description" content="対話型の英会話練習アプリ。完全無料。">
<title>Talkie — じぶん英会話</title>
<style>
:root{
  --bg:#f6f7fb; --card:#ffffff; --ink:#111827; --sub:#6b7280; --line:#e5e7eb;
  --accent:#4f46e5; --accent-soft:#eef2ff; --ai:#ffffff; --me:#4f46e5;
  --ok:#059669; --warn:#d97706; --danger:#dc2626;
  --radius:16px; --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0b1020; --card:#121a30; --ink:#e8ecf5; --sub:#94a3b8; --line:#243050;
    --accent:#818cf8; --accent-soft:#1c2545; --ai:#182242; --me:#4f46e5;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.6;overscroll-behavior-y:none;
}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;color:inherit}

#app{max-width:680px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
header.top h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.02em;flex:1}
header.top .sub{font-size:12px;color:var(--sub);font-weight:500}
.iconbtn{background:transparent;border:1px solid var(--line);border-radius:10px;width:36px;height:36px;
  display:grid;place-items:center;font-size:16px}
main{flex:1;padding:16px;display:flex;flex-direction:column;gap:14px}

nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:40;background:color-mix(in srgb,var(--card) 94%,transparent);
  backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;
  padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;background:none;border:0;padding:6px 2px;border-radius:12px;
  display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--sub);font-weight:600}
nav.tabs button .ic{font-size:19px;line-height:1}
nav.tabs button.on{color:var(--accent);background:var(--accent-soft)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.card h2{margin:0 0 10px;font-size:15px;font-weight:700}
.muted{color:var(--sub);font-size:13px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1}
.btn{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:12px 16px;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:disabled{opacity:.45}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:600}
.btn.soft{background:var(--accent-soft);color:var(--accent);font-weight:700}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn.danger{background:var(--danger)}

.scenes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.scene{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;
  display:flex;flex-direction:column;gap:3px;box-shadow:var(--shadow)}
.scene.on{border-color:var(--accent);background:var(--accent-soft)}
.scene .em{font-size:22px}
.scene .t{font-weight:700;font-size:14px}
.scene .d{font-size:11.5px;color:var(--sub);line-height:1.4}
.seg{display:flex;background:var(--accent-soft);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 4px;font-size:13px;font-weight:700;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--accent);box-shadow:var(--shadow)}

/* chat */
#chatScroll{display:flex;flex-direction:column;gap:14px;padding-bottom:8px}
.msg{max-width:88%;display:flex;flex-direction:column;gap:6px}
.msg.ai{align-self:flex-start}
.msg.me{align-self:flex-end;align-items:flex-end}
.bub{padding:12px 14px;border-radius:16px;box-shadow:var(--shadow);word-break:break-word}
.msg.ai .bub{background:var(--ai);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.me .bub{background:var(--me);color:#fff;border-bottom-right-radius:5px}
.bub .en{font-size:16.5px;line-height:1.55}
.bub .ja{font-size:13px;color:var(--sub);margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.msg.me .bub .ja{color:rgba(255,255,255,.8);border-top-color:rgba(255,255,255,.3)}
.msg .tools{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;font-size:11.5px;color:var(--sub);font-weight:600}
.fb{border-radius:12px;padding:9px 12px;font-size:13px;border:1px solid var(--line);background:var(--card);max-width:88%;align-self:flex-end}
.fb.good{border-color:color-mix(in srgb,var(--ok) 45%,var(--line));color:var(--ok)}
.fb.tip{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.fb .better{color:var(--ink);font-weight:700;margin-top:3px}
.fb .why{color:var(--sub);font-size:12px;margin-top:2px}
.typing{align-self:flex-start;display:flex;gap:4px;padding:14px 16px;background:var(--ai);border:1px solid var(--line);border-radius:16px;border-bottom-left-radius:5px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--sub);display:block;animation:bo 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bo{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}

.hintbox{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line));
  border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.hintbox .hh{font-size:12px;font-weight:700;color:var(--accent)}
.hint{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:9px 11px;text-align:left;width:100%}
.hint .he{font-size:14.5px;font-weight:600}
.hint .hj{font-size:12px;color:var(--sub)}

#composer{position:fixed;bottom:calc(60px + env(safe-area-inset-bottom));left:0;right:0;z-index:35;
  background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
#composerInner{max-width:680px;margin:0 auto;padding:9px 12px;display:flex;gap:8px;align-items:flex-end}
#txt{flex:1;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:10px 14px;resize:none;
  max-height:110px;min-height:42px;line-height:1.45}
.mic{width:52px;height:52px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:22px;
  display:grid;place-items:center;flex:none;box-shadow:var(--shadow)}
.mic.rec{background:var(--danger);animation:pulse 1.3s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(220,38,38,.5)}70%{box-shadow:0 0 0 14px rgba(220,38,38,0)}100%{box-shadow:0 0 0 0 rgba(220,38,38,0)}}
.mic.sm{width:42px;height:42px;font-size:17px;background:var(--card);color:var(--ink);border:1px solid var(--line)}
.mic.sm.rec{background:var(--danger);color:#fff}

.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:22px;line-height:1.2}
.stat span{font-size:11px;color:var(--sub)}

.pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow);
  display:flex;gap:10px;align-items:flex-start}
.pcard.done{opacity:.55}
.pcard .pe{font-weight:700;font-size:15px}
.pcard .pj{font-size:12.5px;color:var(--sub)}

label.f{display:block;font-size:12.5px;font-weight:700;color:var(--sub);margin:12px 0 5px}
input.f,select.f,textarea.f{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:11px;padding:11px 12px}
.sw{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);gap:12px}
.sw:last-child{border-bottom:0}
.sw .l{font-size:14px;font-weight:600}
.sw .l small{display:block;font-weight:400;color:var(--sub);font-size:11.5px}
.toggle{width:48px;height:28px;border-radius:99px;background:var(--line);border:0;position:relative;flex:none;transition:.18s}
.toggle.on{background:var(--accent)}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.18s}
.toggle.on::after{transform:translateX(20px)}
.empty{text-align:center;color:var(--sub);padding:34px 12px;font-size:13.5px}
a{color:var(--accent)}
.hidden{display:none!important}
.bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.toast{position:fixed;bottom:130px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;
  padding:10px 16px;border-radius:99px;font-size:13px;z-index:100;box-shadow:var(--shadow);max-width:90%;text-align:center}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="grow">
      <h1 id="hTitle">Talkie</h1>
      <div class="sub" id="hSub">じぶん英会話</div>
    </div>
    <button class="iconbtn hidden" id="btnEnd" title="会話を終える">🏁</button>
  </header>
  <main id="main"></main>
  <div id="composer" class="hidden">
    <div id="composerInner">
      <button class="mic sm" id="micJa" title="日本語で言う → 英語にしてもらう">あ</button>
      <textarea id="txt" rows="1" placeholder="英語で入力 / マイクで話す"></textarea>
      <button class="mic" id="micEn" title="英語で話す">🎙</button>
    </div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</div>
<script>
/* ============================================================
   Talkie — じぶん英会話  (single file / no build / no server)
   音声認識・読み上げ = ブラウザ標準 / AI = Gemini 無料枠(任意)
   ============================================================ */

/* ---------- 1. シーン定義 + キーなし用の台本 ---------- */
const SCENES = [
{id:'cafe', cat:'life', em:'☕️', t:'カフェで注文', d:'ドリンクを頼んで支払うまで',
 role:'a friendly barista at a coffee shop in Seattle',
 sit:'The user is a customer ordering at the counter. Take their order, ask about size, food, for-here-or-to-go, and payment.',
 script:[
  {en:"Hi there! Welcome in. What can I get started for you today?",ja:"いらっしゃいませ！ご注文は何にしますか？",
   hints:[{en:"Can I get a medium latte, please?",ja:"ラテのMサイズをください"},{en:"What do you recommend?",ja:"おすすめは何ですか？"},{en:"I'd like an iced coffee, please.",ja:"アイスコーヒーをお願いします"}]},
  {en:"Sure thing. What size would you like — small, medium, or large?",ja:"かしこまりました。サイズはS・M・Lどれにしますか？",
   hints:[{en:"Medium, please.",ja:"Mでお願いします"},{en:"I'll go with a small one.",ja:"小さいのにします"},{en:"What's the difference in size?",ja:"サイズの違いは何ですか？"}]},
  {en:"Got it. Would you like anything to eat with that? Our croissants just came out.",ja:"了解です。何か食べ物はいかがですか？クロワッサンが焼きたてですよ",
   hints:[{en:"That sounds good. I'll take one.",ja:"いいですね、1つください"},{en:"No thanks, just the drink.",ja:"いえ、飲み物だけで大丈夫です"},{en:"Is it sweet or savory?",ja:"甘いですか、しょっぱいですか？"}]},
  {en:"Perfect. Is that for here or to go?",ja:"承知しました。店内でお召し上がりですか、お持ち帰りですか？",
   hints:[{en:"For here, please.",ja:"店内でお願いします"},{en:"To go, please.",ja:"持ち帰りでお願いします"},{en:"Can I decide after I pay?",ja:"支払い後に決めてもいいですか？"}]},
  {en:"That comes to six dollars and fifty cents. Cash or card?",ja:"6ドル50セントになります。現金かカードどちらですか？",
   hints:[{en:"Card, please.",ja:"カードでお願いします"},{en:"I'll pay with cash.",ja:"現金で払います"},{en:"Do you take Apple Pay?",ja:"Apple Payは使えますか？"}]},
  {en:"All set. Your name for the cup? I'll call you when it's ready.",ja:"完了です。カップに書くお名前は？できたらお呼びします",
   hints:[{en:"It's Shu. S-H-U.",ja:"シュウです。S-H-Uです"},{en:"Sure, it's Shu. Thank you!",ja:"はい、シュウです。ありがとう！"},{en:"Could you write it as 'Shu'?",ja:"「Shu」と書いてもらえますか？"}]}
 ]},
{id:'airport', cat:'travel', em:'✈️', t:'入国審査', d:'目的・滞在日数・宿泊先を答える',
 role:'an immigration officer at Los Angeles International Airport',
 sit:'The user is a Japanese traveler going through immigration. Ask standard questions politely but formally.',
 script:[
  {en:"Good afternoon. May I see your passport, please?",ja:"こんにちは。パスポートを見せてください",
   hints:[{en:"Here you are.",ja:"どうぞ"},{en:"Sure, here's my passport.",ja:"はい、パスポートです"},{en:"Of course. Here it is.",ja:"もちろんです。こちらです"}]},
  {en:"Thank you. What's the purpose of your visit?",ja:"ありがとう。訪問の目的は何ですか？",
   hints:[{en:"I'm here for sightseeing.",ja:"観光で来ました"},{en:"I'm visiting my friend.",ja:"友達に会いに来ました"},{en:"I'm here to study English.",ja:"英語を勉強しに来ました"}]},
  {en:"I see. How long will you be staying in the United States?",ja:"なるほど。アメリカにはどのくらい滞在しますか？",
   hints:[{en:"For ten days.",ja:"10日間です"},{en:"About two weeks.",ja:"2週間くらいです"},{en:"Until the end of this month.",ja:"今月末までです"}]},
  {en:"And where will you be staying?",ja:"どこに滞在する予定ですか？",
   hints:[{en:"At a hotel in downtown LA.",ja:"ダウンタウンLAのホテルです"},{en:"At my friend's place in Santa Monica.",ja:"サンタモニカの友人宅です"},{en:"I have the address right here.",ja:"ここに住所があります"}]},
  {en:"Do you have a return ticket?",ja:"帰りのチケットはお持ちですか？",
   hints:[{en:"Yes, I fly back on the 20th.",ja:"はい、20日に帰ります"},{en:"Yes, would you like to see it?",ja:"はい、お見せしましょうか？"},{en:"Yes, it's on my phone.",ja:"はい、スマホに入っています"}]},
  {en:"Everything looks good. Enjoy your stay. Welcome to the United States.",ja:"問題ありません。良い滞在を。アメリカへようこそ",
   hints:[{en:"Thank you very much!",ja:"ありがとうございます！"},{en:"Thanks, have a good day.",ja:"ありがとう、良い一日を"},{en:"Thank you, I'm excited to be here.",ja:"ありがとう、来られて嬉しいです"}]}
 ]},
{id:'intro', cat:'basic', em:'👋', t:'自己紹介・雑談', d:'初対面の人と打ち解ける',
 role:'Alex, a friendly American student the same age as the user, meeting them for the first time at a school event',
 sit:'Small talk between two students meeting for the first time. Be curious and casual.',
 script:[
  {en:"Hey! I don't think we've met. I'm Alex. What's your name?",ja:"やあ！初めましてだよね。アレックスです。名前は？",
   hints:[{en:"I'm Shu. Nice to meet you.",ja:"シュウです。よろしく"},{en:"Hi Alex, I'm Shu.",ja:"やあアレックス、シュウです"},{en:"Shu. Good to meet you!",ja:"シュウです。会えて嬉しいです！"}]},
  {en:"Nice to meet you, Shu! So where are you from?",ja:"よろしく、シュウ！出身はどこ？",
   hints:[{en:"I'm from Japan.",ja:"日本から来ました"},{en:"I'm from Tokyo, Japan.",ja:"日本の東京出身です"},{en:"Japan. Have you ever been there?",ja:"日本です。行ったことある？"}]},
  {en:"Oh cool, I've always wanted to go. So what do you do? Are you a student?",ja:"いいね、ずっと行ってみたかったんだ。何してるの？学生？",
   hints:[{en:"Yeah, I'm a high school student.",ja:"うん、高校生です"},{en:"I'm in my second year of high school.",ja:"高校2年生です"},{en:"I'm a student. How about you?",ja:"学生です。君は？"}]},
  {en:"Same here. What do you like to do in your free time?",ja:"僕もだよ。暇なときは何してるの？",
   hints:[{en:"I like running and making apps.",ja:"走ることとアプリ作りが好きです"},{en:"I'm into programming these days.",ja:"最近プログラミングにハマってます"},{en:"I usually watch YouTube or study.",ja:"だいたいYouTubeを見るか勉強してます"}]},
  {en:"That's awesome. How long have you been doing that?",ja:"すごいね。どのくらいやってるの？",
   hints:[{en:"For about a year now.",ja:"1年くらいです"},{en:"I started last spring.",ja:"去年の春に始めました"},{en:"Not that long, maybe six months.",ja:"そんなに長くない、半年くらい"}]},
  {en:"Nice! We should hang out sometime. See you around, Shu!",ja:"いいね！また遊ぼうよ。じゃあね、シュウ！",
   hints:[{en:"Sounds good. See you!",ja:"いいね。またね！"},{en:"Definitely. Let's keep in touch.",ja:"ぜひ。連絡取り合おう"},{en:"Yeah, see you later!",ja:"うん、またね！"}]}
 ]},
{id:'restaurant', cat:'life', em:'🍽', t:'レストラン', d:'席の案内から会計まで',
 role:'a server at a casual American restaurant',
 sit:'The user is a customer. Seat them, take drink and food orders, check on them, bring the check.',
 script:[
  {en:"Good evening! Welcome. How many in your party tonight?",ja:"こんばんは！何名様ですか？",
   hints:[{en:"Just one, please.",ja:"1人です"},{en:"Two, please.",ja:"2人です"},{en:"Table for two, if possible.",ja:"できれば2人席をお願いします"}]},
  {en:"Right this way. Here's the menu. Can I start you off with something to drink?",ja:"こちらへどうぞ。メニューです。まずお飲み物はいかがですか？",
   hints:[{en:"Just water, please.",ja:"お水をお願いします"},{en:"I'll have an iced tea.",ja:"アイスティーをください"},{en:"Could I have a minute to look?",ja:"少し見る時間をもらえますか？"}]},
  {en:"Sure. Are you ready to order, or do you need a few more minutes?",ja:"もちろん。ご注文は決まりましたか？もう少しかかりますか？",
   hints:[{en:"I'll have the cheeseburger, please.",ja:"チーズバーガーをください"},{en:"What's the most popular dish here?",ja:"一番人気の料理は何ですか？"},{en:"A few more minutes, please.",ja:"もう少し待ってください"}]},
  {en:"Great choice. How would you like that cooked?",ja:"いい選択です。焼き加減はどうしますか？",
   hints:[{en:"Medium, please.",ja:"ミディアムでお願いします"},{en:"Well done, please.",ja:"よく焼いてください"},{en:"What do you usually recommend?",ja:"普段は何がおすすめですか？"}]},
  {en:"Coming right up. ... How is everything tasting?",ja:"すぐお持ちします。…お味はいかがですか？",
   hints:[{en:"It's delicious, thank you.",ja:"美味しいです、ありがとう"},{en:"Really good! Could I get more water?",ja:"すごく美味しい！お水をもらえますか？"},{en:"It's a bit salty, but I like it.",ja:"少ししょっぱいけど好きです"}]},
  {en:"Glad to hear it. Here's your check whenever you're ready. Have a great night!",ja:"よかったです。お会計はこちらです。良い夜を！",
   hints:[{en:"Thank you. Can I pay by card?",ja:"ありがとう。カードで払えますか？"},{en:"Thanks! Is the tip included?",ja:"ありがとう！チップは含まれていますか？"},{en:"Thank you, everything was great.",ja:"ありがとう、全部よかったです"}]}
 ]},
{id:'hotel', cat:'travel', em:'🏨', t:'ホテル', d:'チェックインと部屋のお願い',
 role:'a hotel front desk receptionist',
 sit:'The user is checking in. Handle reservation, spelling, room details, breakfast, key card, and requests.',
 script:[
  {en:"Good evening, welcome to the Grand Hotel. Do you have a reservation with us?",ja:"こんばんは、グランドホテルへようこそ。ご予約はございますか？",

/* 間隔反復：正解するたびに次に会う日が伸びる（ミスノートと同じ考え方） */
const SRS_DAYS=[0,1,3,7,16,35,70];
const DAY=86400000;
function srsInit(p){
  if(p.box==null) p.box=0;
  if(p.due==null) p.due=p.ts||Date.now();
  if(p.seen==null) p.seen=0;
  if(p.ok==null) p.ok=0;
  return p;
}
phrases.forEach(srsInit);
function srsAnswer(p,correct){
  p.seen=(p.seen||0)+1;
  if(correct){
    p.ok=(p.ok||0)+1;
    p.box=Math.min(SRS_DAYS.length-1,(p.box||0)+1);
    p.due=Date.now()+SRS_DAYS[p.box]*DAY;
  }else{
    // 間違えたものは大きく戻して「その日のうちにもう一度」出す
    p.box=Math.max(0,(p.box||0)-2);
    p.due=Date.now()+10*60*1000;
  }
  p.last=Date.now();
}
const dueList = ()=> phrases.filter(p=>(p.due||0)<=Date.now());
const learned = ()=> phrases.filter(p=>(p.box||0)>=4).length;
function nextDueLabel(){
  if(!phrases.length) return '';
  const f=phrases.map(p=>p.due||0).filter(d=>d>Date.now()).sort((a,b)=>a-b)[0];
  if(!f) return '';
  const d=Math.ceil((f-Date.now())/DAY);
  return d<=1? '次の復習はあした' : `次の復習は${d}日後`;
}

let voices=[];
function loadVoices(){ voices=(speechSynthesis.getVoices()||[]).filter(v=>/^en/i.test(v.lang)); }
loadVoices();
if(typeof speechSynthesis!=='undefined') speechSynthesis.onvoiceschanged=loadVoices;
function pickVoice(){
  if(!voices.length) loadVoices();
  const acc = app && app.chat && app.chat.accent;
  if(!cfg.voiceURI && acc){
    const byAcc=voices.filter(v=>v.lang.replace('_','-').toLowerCase().startsWith(acc.toLowerCase()));
    if(byAcc.length) return byAcc.find(v=>/Google|Samantha|Daniel|Kate|Serena|Ava/i.test(v.name)) || byAcc[0];
  }
  return voices.find(v=>v.voiceURI===cfg.voiceURI)
      || voices.find(v=>/en-US/i.test(v.lang) && /Samantha|Google US|Ava|Allison/i.test(v.name))
      || voices.find(v=>/en-US/i.test(v.lang)) || voices[0] || null;
}
let speakSeq=0;
function speak(text,rate,onDone){
  const done=()=>{ try{ onDone&&onDone(); }catch(e){} };
  if(!('speechSynthesis' in window)){ done(); return; }
  try{
    speechSynthesis.cancel();
    const my=++speakSeq, t0=Date.now();
    const u=new SpeechSynthesisUtterance(String(text).replace(/[*_`#]/g,''));
    const v=pickVoice(); if(v){ u.voice=v; u.lang=v.lang; } else u.lang='en-US';
    const styleDelta = (app && app.chat && app.chat.style)? ST(app.chat.style).rate : 0;
    u.rate=Math.min(1.4,Math.max(0.5, rate!=null? rate : cfg.rate+styleDelta)); u.pitch=1;
    let fired=false, watch=null;
    const fin=()=>{ if(fired) return; fired=true; clearInterval(watch); if(my===speakSeq) done(); };
    u.onend=fin; u.onerror=fin;
    // onend が来ないブラウザ（Safari など）用の見張り
    watch=setInterval(()=>{
      if(fired||my!==speakSeq){ clearInterval(watch); return; }
      if(Date.now()-t0>900 && !speechSynthesis.speaking && !speechSynthesis.pending) fin();
    },350);
    speechSynthesis.speak(u);
  }catch(e){ done(); }
}
const stopSpeak = ()=>{ speakSeq++; try{ speechSynthesis.cancel(); }catch(e){} };

/* ---------- 5. 音声認識（無料・ブラウザ標準） ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const srAvailable = !!SR;
let rec=null, recFinish=null, recStopping=false, silT=null;
/* ブラウザ標準の音声認識は「少し黙るとすぐ切れる」ので、
   continuous で開きっぱなしにして、無音の長さは自分のタイマーで測る。 */
function startRec(lang, onFinal, onInterim, onEnd){
  if(!SR){ toast('このブラウザは音声認識に非対応です。文字で入力してください'); onEnd&&onEnd(); return; }
  stopSpeak();
  if(recFinish) recFinish();
  let finalTxt='', heard=false, ended=false, restarts=0;
  const t0=Date.now();
  recStopping=false;
  const gap = ()=> Math.round((cfg.silence||4.5)*1000);          // 話したあとの無音
  const firstGap = ()=> Math.max(gap()+2500, 7000);              // まだ一言も出ていないとき
  const arm = ms=>{ clearTimeout(silT); silT=setTimeout(()=>finish(), ms); };
  function finish(){
    if(ended) return; ended=true; recStopping=true; recFinish=null;
    clearTimeout(silT);
    try{ rec&&rec.stop(); }catch(e){}
    onEnd&&onEnd();
    const t=finalTxt.trim(); if(t) onFinal&&onFinal(t);
  }
  recFinish=finish;
  function mk(){
    const r=new SR();
    r.lang=lang; r.interimResults=true; r.continuous=true; r.maxAlternatives=1;
    r.onresult=e=>{
      let interim='';
      for(let i=e.resultIndex;i<e.results.length;i++){
        const tx=e.results[i][0].transcript;
        if(e.results[i].isFinal) finalTxt+=(finalTxt?' ':'')+tx.trim(); else interim+=tx;
      }
      const cur=(finalTxt+' '+interim).trim();
      if(cur){ heard=true; onInterim&&onInterim(cur); }
      arm(heard? gap() : firstGap());
    };
    r.onerror=e=>{
      if(e.error==='not-allowed'){ toast('マイクが許可されていません（ブラウザの設定を確認）'); finish(); }
      else if(e.error==='audio-capture'){ toast('マイクが見つかりません'); finish(); }
      else if(e.error==='no-speech'){ /* 自前タイマーに任せるので無視 */ }
      else if(e.error!=='aborted'){ toast('音声認識エラー: '+e.error); }
    };
    r.onend=()=>{
      if(ended||recStopping) return;
      // Chrome は数秒で勝手に切るので、無音タイマーが鳴るまでは繋ぎ直す
      if(restarts++>60 || Date.now()-t0>150000){ finish(); return; }
      try{ rec=mk(); rec.start(); }catch(e){ finish(); }
    };
    return r;
  }
  try{ rec=mk(); rec.start(); arm(firstGap()); }
  catch(e){ recFinish=null; onEnd&&onEnd(); }
}
function stopRec(){ if(recFinish) recFinish(); else { recStopping=true; clearTimeout(silT); try{ rec&&rec.stop(); }catch(e){} } }

/* ---------- 6. Gemini（無料枠 / キーは端末内だけに保存） ---------- */
const hasKey = ()=> !!cfg.apiKey.trim();
async function gemini({system, contents, schema, temp=0.9}){
  if(!hasKey()) throw new Error('NO_KEY');
  const url=`https://generativelanguage.googleapis.com/v1beta/models/${cfg.model}:generateContent?key=${encodeURIComponent(cfg.apiKey.trim())}`;
  const body={ contents, generationConfig:{ temperature:temp } };
  if(system) body.systemInstruction={parts:[{text:system}]};
  if(schema){ body.generationConfig.responseMimeType='application/json'; body.generationConfig.responseSchema=schema; }
  bumpUsage();
  if(useMinute()>=limit().rpm) toast(`1分あたりの目安（${limit().rpm}回）に達しました。少し待つと安定します`);
  const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!res.ok){
    const t=await res.text().catch(()=> '');
    if(res.status===400 && /API key/i.test(t)) throw new Error('APIキーが正しくないようです（設定で確認）');
    if(res.status===429) throw new Error(`無料枠の上限です（今日 ${useToday()}回目）。1分ほど待つか、設定で flash-lite に変えてください`);
    if(res.status===403) throw new Error('APIキーが無効か、権限がありません');
    throw new Error('通信エラー ('+res.status+')');
  }
  const j=await res.json();
  const txt=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('').trim();
  if(!txt) throw new Error('AIの返事が空でした。もう一度試してください');
  if(!schema) return txt;
  try{ return JSON.parse(txt); }
  catch(e){
    const m=txt.match(/\{[\s\S]*\}/);
    if(m){ try{ return JSON.parse(m[0]); }catch(_){} }
    throw new Error('返事の形式が読めませんでした');
  }
}

function bindFreePanel(){
  const F=cfg.free;
  document.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{ F.char=b.dataset.ch; saveCfg(); render(); });
  document.querySelectorAll('[data-tp]').forEach(b=>b.onclick=()=>{ F.topic=b.dataset.tp; saveCfg(); render(); });
  document.querySelectorAll('[data-ms]').forEach(b=>b.onclick=()=>{ F.mission=b.dataset.ms; saveCfg(); render(); });
  const tc=$('#topicCustom'); if(tc) tc.oninput=e=>{ F.topicCustom=e.target.value; cfg.free.topicCustom=e.target.value; saveCfg(); };
  const fl=$('#freeLen'); if(fl) fl.onclick=e=>{ const b=e.target.closest('[data-fl]'); if(!b) return; F.len=b.dataset.fl; saveCfg(); render(); };
  const ud=$('#useDaily'); if(ud) ud.onclick=()=>{ F.topic='custom'; F.topicCustom=dailyQ().en; saveCfg(); render(); toast('今日のお題を話題にしました'); };
  document.querySelectorAll('#main [data-sayt]').forEach(b=>b.onclick=()=>speak(b.dataset.sayt));
  const rf=$('#randomFree'); if(rf) rf.onclick=()=>{
    const pk=a=>a[Math.floor(Math.random()*a.length)];
    F.char=pk(CHARS).id; F.topic=pk(TOPICS.filter(t=>t.id!=='custom'&&t.id!=='auto')).id;
    F.mission=pk(MISSIONS[cfg.level]||MISSIONS.b).id; saveCfg(); render(); toast('おまかせで組み合わせました');
  };
}
function missionOf(){
  const F=cfg.free, ms=MISSIONS[cfg.level]||MISSIONS.b;
  if(F.mission==='none') return null;
  if(F.mission==='auto') return ms[Math.floor(Math.random()*ms.length)];
  return ms.find(x=>x.id===F.mission)||null;
}
function topicOf(){
  const F=cfg.free;
  if(F.topic==='custom') return F.topicCustom.trim();
  const t=TOPICS.find(x=>x.id===F.topic);
  return t&&t.p? t.p : '';
}

function ring(done,goal){
  const r=30, c=2*Math.PI*r, pct=Math.min(1,goal? done/goal:0);
  return `<svg width="78" height="78" viewBox="0 0 78 78" style="flex:none">
    <circle cx="39" cy="39" r="${r}" fill="none" stroke="var(--line)" stroke-width="8"/>
    <circle cx="39" cy="39" r="${r}" fill="none" stroke="${pct>=1?'var(--ok)':'var(--accent)'}" stroke-width="8"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct)}" transform="rotate(-90 39 39)"/>
    <text x="39" y="37" text-anchor="middle" font-size="19" font-weight="800" fill="currentColor">${done}</text>
    <text x="39" y="52" text-anchor="middle" font-size="10" fill="var(--sub)">/ ${goal}</text>
  </svg>`;
}

function streak(){
  const days=[...new Set(sessions.map(s=>todayKey(new Date(s.ts))))].sort().reverse();
  let n=0; let d=new Date();
  if(days[0]!==todayKey(d)) d.setDate(d.getDate()-1);
  while(days.includes(todayKey(d))){ n++; d.setDate(d.getDate()-1); }
  const today=sessions.filter(s=>todayKey(new Date(s.ts))===todayKey()).reduce((a,s)=>a+(s.turns||0),0);
  return {streak:n, today};
}

/* ---------- 9. 会話 ---------- */
function startChat(sceneId){
  const sc=SCENES.find(s=>s.id===sceneId);
  if(sc.custom && !pick.custom.trim()){ toast('どんな場面か書いてください'); return; }
  const isFree = sc.id==='free';
  const ch = isFree? (CHARS.find(x=>x.id===cfg.free.char)||CHARS[0]) : null;
  const mi = isFree? missionOf() : null;
  if(isFree && cfg.free.topic==='custom' && !cfg.free.topicCustom.trim()){ toast('話したいことを書くか、別の話題を選んでください'); return; }
  app.chat={
    scene:sc, level:cfg.level, style:cfg.style, custom:pick.custom.trim(),
    char:ch, topic:isFree? topicOf() : '', mission:mi, missionDone:false,
    len:isFree? cfg.free.len : 'normal', accent: ch? ch.acc : '',
    msgs:[], step:0, t0:Date.now(), hints:null, showHints:false, ended:false, report:null,
    wordPanel:null, tools:false
  };
  render();
  nextAiTurn(true);
}
$('#btnEnd').onclick=()=>{ if(app.chat && !app.chat.ended) finishChat(); };

function renderChat(m){
  const c=app.chat;
  $('#hTitle').textContent=(c.char? c.char.em+' '+c.char.name : c.scene.em+' '+c.scene.t);
  $('#hSub').textContent=[
    c.char? c.char.t : (hasKey()?'AIモード':'台本モード'),
    LV(c.level).t+'('+LV(c.level).cefr+')',
    c.style!=='normal'? ST(c.style).em+ST(c.style).t : '',
    c.mission? (c.missionDone?'⭐️ ミッション達成':'🎯 '+c.mission.t) : ''
  ].filter(Boolean).join(' ・ ');
  m.innerHTML=`<div id="chatScroll"></div>`;
  paintMsgs();
}

  const bw=$('#bWord'); if(bw) bw.onclick=()=>{ c.wordPanel=c.wordPanel?null:{q:'',result:null}; paintMsgs(); const i=$('#wq'); if(i) i.focus(); };
  const bl=$('#bLevel'); if(bl) bl.onclick=()=>{
    const i=LEVELS.findIndex(l=>l.id===c.level); const nx=LEVELS[(i+1)%LEVELS.length];
    c.level=nx.id; cfg.level=nx.id; saveCfg(); renderChat($('#main'));
    toast('この会話のむずかしさを「'+nx.t+'」にしました');
  };
  const wq=$('#wq'); if(wq){
    wq.oninput=e=>{ c.wordPanel.q=e.target.value; };
    wq.onkeydown=e=>{ if(e.key==='Enter'&&!e.isComposing){ e.preventDefault(); askWord(); } };
  }
  const wgo=$('#wgo'); if(wgo) wgo.onclick=askWord;
  const wclose=$('#wclose'); if(wclose) wclose.onclick=()=>{ c.wordPanel=null; paintMsgs(); };
  const wuse=$('#wuse'); if(wuse) wuse.onclick=()=>{ $('#txt').value=c.wordPanel.result.example_en; autoGrow(); c.wordPanel=null; paintMsgs(); $('#txt').focus(); };
  const wkeep=$('#wkeep'); if(wkeep) wkeep.onclick=()=>{ const r=c.wordPanel.result; addPhrase(r.en,r.ja,'単語メモ'); };
  scrollDown();
}
function scrollDown(){ requestAnimationFrame(()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})); }

/* --- AIへの指示文 --- */
function systemPrompt(c){
  const lv=LV(c.level);
  const isFree=c.scene.id==='free';
  let sit=c.scene.custom? c.custom : c.scene.sit;
  let role=c.scene.custom? 'the most natural conversation partner for this situation' : c.scene.role;
  if(isFree && c.char){
    role=c.char.p;
    sit='Free conversation between friends. '+(c.topic
      ? 'Start from this topic and stay roughly around it, but let it drift naturally: '+c.topic+'.'
      : 'Pick an interesting everyday topic yourself and start from there.')
      +' Share your own opinions and small stories too, so it feels like a real two-way conversation, not an interview.';
  }
  const st=ST(c.style||'normal');
  return `You are ${role}. You are having a REAL spoken conversation with a Japanese learner of English${cfg.name?' named '+cfg.name:''}.

SITUATION: ${sit}

## How you speak
- ${lv.ins}
- ${st.ins}
- One turn at a time: 1-3 sentences. Usually end with something the learner can respond to — but not always a question. Sometimes just react and let them carry it.
- Speak ONLY as the character. "reply" is read aloud by a speech engine: no emoji, no asterisks, no stage directions, no romaji, no Japanese.
- Never say "as an AI". Never break character. Never grade or correct them inside "reply" (corrections go in "feedback" only)${c.style==='gentle'?' — you may naturally re-use the correct form in your own sentence, without pointing it out':''}.

## How you keep the conversation alive (this is the important part)
- You are a PERSON with your own opinions, habits and small stories. Volunteer them. A conversation where you only ask questions is a failure.
- Actually respond to the CONTENT of what they said, not just its form. Pick up the most interesting detail and go after it.
- If their answer is thin ("It was fun."), dig one level deeper: ask what specifically, why, what happened next, how it felt.
- Never ask a question you have already asked, and never re-ask something they just answered.
- Let the topic drift the way real conversation does: their answer should suggest your next subject.
- Vary your turn shapes: sometimes a reaction + your own story, sometimes a short surprised comment, sometimes a follow-up question, sometimes disagreement.
- Silence and short answers are the learner's problem to solve; give them something concrete to react to rather than an open "What else?".

## Stretching their English (i+1)
- Deliberately include ONE expression slightly above their current level in most of your turns: a natural collocation, phrasal verb, or idiom they probably do not use yet — but that the surrounding context makes guessable.
- Put that expression (max 2 per turn) into "new_words" with a natural Japanese meaning and, in "why_ja", when a native would use it (max 40 Japanese characters). If your turn contains nothing above their level, return an empty array.

## The JSON fields
- "reply_ja": a natural Japanese translation of your reply, in spoken Japanese, not a literal gloss.
- "hints": exactly 3 things the LEARNER could say next. They must differ in CONTENT and direction — for example (1) answer straight, (2) ask something back, (3) disagree, hesitate or change the subject. Not three ways to say the same thing. Match their level, 3-12 words each.
- "feedback" is about the learner's LAST message only:
   * "none" for their very first turn, or if they said nothing meaningful.
   * "good" if it was already natural for their level (leave "better" empty).
   * "tip" if a native would say it differently. Put the improved English in "better" and a SHORT Japanese explanation (max 40 Japanese characters) in "why_ja".
   * At levels A2-B1, only flag things that hurt understanding. At B2 and above, also flag unnatural collocations, register mismatches (too formal or too childish for the situation), and sentences that are correct but that no native would actually say.
   * "cat": which kind of issue it is — tense / article / preposition / word-order / plural / vocab / expression / question / other.
- "done": true only when the scene has genuinely finished.
${lengthRule(c)}${missionRule(c)}`;
}
function lengthRule(c){
  const map={short:5,normal:10,long:20};
  if(c.len==='endless') return '\n- NEVER end the conversation yourself. Always keep it going with a new question. Set "done" to false every time.';
  const t=map[c.len]||cfg.turns;
  return `\n- Aim to wrap the conversation up naturally after about ${t} learner turns.`;
}
function missionRule(c){
  if(!c.mission) return '';
  return `\n- MISSION: the learner is trying to use "${c.mission.t}" at least once. Set "mission_used" to true ONLY on the turn where their message actually contains that pattern used correctly. Do not tell them about the mission unless they ask. If they have not used it after several turns, steer the conversation so that using it becomes natural (for example by asking a question that invites it).`;
}
function historyContents(c){
  return c.msgs.map(m=>({role: m.role==='ai'?'model':'user', parts:[{text:m.en}]}));
}

/* --- AIの番 --- */
async function nextAiTurn(first,directive){
  const c=app.chat;
  app.busy=true; paintMsgs();
  try{
    if(hasKey()){
      const contents=historyContents(c);
      if(first) contents.push({role:'user',parts:[{text:'(The learner has just arrived. Start the conversation with your first line.'+(c.topic?' Open with the topic given in your instructions.':'')+')'}]});
      else if(directive) contents.push({role:'user',parts:[{text:directive}]});
      const r=await gemini({system:systemPrompt(c), contents, schema:TURN_SCHEMA});
      app.busy=false;
      c.msgs.push({role:'ai', en:r.reply, ja:r.reply_ja, nw:(r.new_words||[]).slice(0,2)});
      const last=[...c.msgs].reverse().find(m=>m.role==='me');
      if(last && r.feedback && !(directive && r.feedback.status==='none' && last.fb)) last.fb=r.feedback;
      c.hints=(r.hints||[]).slice(0,3); c.showHints=false;
      if(r.mission_used && c.mission && !c.missionDone){
        c.missionDone=true; if(last) last.mission=true;
        toast('⭐️ ミッション達成！「'+c.mission.t+'」が使えました');
      }
      paintMsgs();
      afterAiSpoke(r.reply);
      if(r.done && c.len!=='endless') setTimeout(()=>{ if(app.chat && !app.chat.ended) finishChat(); },1400);
    }else{
      // 台本モード
      const sp=c.scene.script||[];
      const line=sp[c.step];
      await new Promise(r=>setTimeout(r,420));
      app.busy=false;
      if(!line){ paintMsgs(); finishChat(); return; }
      c.msgs.push({role:'ai', en:line.en, ja:line.ja});
      c.hints=line.hints; c.showHints=false;
      c.step++;
      paintMsgs();
      afterAiSpoke(line.en);
    }
  }catch(e){
    app.busy=false;
    if(e.message==='NO_KEY'){ toast('AIキーが未設定です'); }
    else toast(e.message);
    paintMsgs();
  }
}

/* --- 自分の番 --- */
async function sendMsg(text){
  const c=app.chat; if(!c || c.ended) return;
  const t=String(text||'').trim(); if(!t) return;
  if(app.busy){ toast('AIが考えています…'); return; }
  stopSpeak(); stopRec();
  c.msgs.push({role:'me', en:t});
  c.showHints=false; c.hints=null;
  $('#txt').value=''; autoGrow();
  paintMsgs();
  if(!hasKey()){
    // 台本モード：簡易フィードバック
    const fb=localFeedback(t);
    c.msgs[c.msgs.length-1].fb=fb;
    if(c.step>=(c.scene.script||[]).length){ paintMsgs(); finishChat(); return; }
  }
  await nextAiTurn(false);
}
function localFeedback(t){
  const w=wordCount(t);
  if(/[ぁ-んァ-ン一-龥]/.test(t)) return {status:'tip', better:'', why_ja:'日本語が混ざっています。英語だけで言ってみましょう'};
  if(w<=1) return {status:'tip', better:'', why_ja:'単語1つより、文にすると伝わります（例: Yes, please.）'};
  const fixes=[[/\bi\b/g,'I'],[/^i'm/i,"I'm"]];
  let better=t; fixes.forEach(([re,to])=>better=better.replace(re,to));
  if(!/[.!?]$/.test(better)) better+='.';
  better=better.charAt(0).toUpperCase()+better.slice(1);
  if(better!==t) return {status:'tip', better, why_ja:'大文字と句読点を整えるともっと読みやすいです'};
  return {status:'good', better:'', why_ja:''};
}

/* --- ヒント --- */
async function onHint(){
  const c=app.chat;
  if(c.hints && c.hints.length){ c.showHints=!c.showHints; paintMsgs(); return; }
  if(!hasKey()){ toast('この場面のヒントは用意されていません'); return; }
  app.busy=true; paintMsgs();
  try{
    const r=await gemini({system:systemPrompt(c),
      contents:[...historyContents(c),{role:'user',parts:[{text:'(The learner is stuck. Do NOT continue the conversation. Repeat your previous line in "reply" and give 3 useful hints.)'}]}],
      schema:TURN_SCHEMA, temp:1.0});
    c.hints=(r.hints||[]).slice(0,3); c.showHints=true;
  }catch(e){ toast(e.message); }
  app.busy=false; paintMsgs();
}

/* --- 「これ英語でなんて言う？」 --- */
async function askWord(){
  const c=app.chat; if(!c||!c.wordPanel) return;
  const q=(c.wordPanel.q||'').trim();
  if(!q){ toast('知りたい言葉を日本語で書いてください'); return; }
  if(!hasKey()){ toast('この機能はAIキーが必要です'); return; }
  app.busy=true; paintMsgs();
  try{
    const lv=LV(c.level);
    const r=await gemini({
      system:`A Japanese learner wants to know how to say something in English during a conversation. Reply in JSON.
- "en": the most natural English word or phrase real speakers use for it. NOT a literal dictionary translation.
- "ja": a short Japanese gloss.
- "example_en": one sentence the learner could actually say right now in this conversation, using it. ${lv.ins}
- "example_ja": Japanese translation of that sentence.
- "note_ja": a short Japanese note on nuance or when to use it (max 50 Japanese characters).`,
      contents:[{role:'user',parts:[{text:'Conversation so far:\n'+c.msgs.slice(-4).map(m=>(m.role==='ai'?'Partner: ':'Me: ')+m.en).join('\n')+'\n\nJapanese the learner wants to say: '+q}]}],
      schema:WORD_SCHEMA, temp:0.5});
    c.wordPanel.result=r;
  }catch(e){ toast(e.message); }
  app.busy=false; paintMsgs();
}

/* --- 日本語で言う → 英語にしてもらう --- */
async function jaToEn(ja){
  if(!hasKey()){ toast('この機能はAIキーが必要です'); return; }
  app.busy=true; paintMsgs();
  try{
    const lv=LV(app.chat.level);
    const r=await gemini({
      system:`Translate the learner's Japanese into ONE natural English sentence they could actually say in this conversation. ${lv.ins} Reply with JSON only.`,
      contents:[{role:'user',parts:[{text:'Conversation so far:\n'+app.chat.msgs.slice(-4).map(m=>(m.role==='ai'?'Partner: ':'Me: ')+m.en).join('\n')+'\n\nJapanese to say: '+ja}]}],
      schema:S({en:{type:'string'}},['en']), temp:0.5});
    $('#txt').value=r.en; autoGrow(); speak(r.en);
    toast('英語にしました。読み上げを真似して送信してみましょう');
  }catch(e){ toast(e.message); }
  app.busy=false; paintMsgs();
}

/* --- 会話を終える → レポート --- */
async function finishChat(){
  const c=app.chat; if(!c || c.ended) return;
  const mine=c.msgs.filter(m=>m.role==='me');
  if(!mine.length){ app.chat=null; stopSpeak(); render(); return; }
  c.ended=true; stopSpeak(); stopRec();
  $('#composer').classList.add('hidden');
  $('#btnEnd').classList.add('hidden');
  document.body.style.paddingBottom='';
  app.busy=true; paintMsgs();
  let rep=null;
  if(hasKey()){
    try{
      rep=await gemini({
        system:`You are a warm, encouraging English coach for a Japanese learner. Review the conversation below and reply in JSON.
- "score": 0-100 for how well the learner communicated in this scene. Be generous but honest.
- "summary_ja": 1-2 sentences in Japanese about how the conversation went. Praise something specific they actually said.
- "good_points": 1-3 short Japanese strings, each quoting the learner's own English that worked well.
- "fixes": up to 3 items. "you" = what the learner actually wrote, "better" = a natural rewrite, "why_ja" = short Japanese reason (max 40 chars). "cat" = which kind of mistake it is: tense(時制) / article(冠詞) / preposition(前置詞) / word-order(語順) / plural(単複) / vocab(単語選び) / expression(言い回しが不自然) / question(疑問文の作り方) / other. Only real problems, not nitpicks. Empty array if nothing to fix.
- "phrases": 3-5 useful English expressions FROM OR FOR this scene worth memorizing, with Japanese.
- "cefr": your honest CEFR estimate of the ENGLISH THE LEARNER PRODUCED in this conversation (A1-C2). Judge only what they actually wrote: sentence length, range of structures, and whether they could handle the unexpected. Do not inflate it to be kind.
- "cefr_why_ja": one Japanese sentence saying what specifically decided that level, quoting their English.
- "advanced_used": Japanese strings naming any expression above the basics that they actually pulled off, quoting it. Empty array if none.
- "next_expressions": 2-4 expressions ONE STEP ABOVE what they used, that would have fit this exact conversation. {"en","ja","when_ja" = when to use it, max 25 Japanese chars}. These should feel like the natural next thing to learn, not random vocabulary.
- "next_goal_ja": one concrete thing to try next time, in Japanese, one sentence.`,
        contents:[{role:'user',parts:[{text:`Scene: ${c.scene.custom?c.custom:c.scene.t}${c.char?' (free talk with '+c.char.name+')':''}${c.topic?'\nTopic: '+c.topic:''}${c.mission?'\nThe learner was trying to use: '+c.mission.t+' ('+(c.missionDone?'they managed it':'they did not manage it')+')':''}\nLevel setting: ${LV(c.level).t} (${LV(c.level).cefr}) / partner style: ${ST(c.style||'normal').t}\n\n`+c.msgs.map(m=>(m.role==='ai'?'Partner: ':'Learner: ')+m.en).join('\n')}]}],
        schema:REPORT_SCHEMA, temp:0.6});
    }catch(e){ toast(e.message); }
  }
  if(!rep) rep=localReport(c);
  app.busy=false;
  c.report=rep;
  const sec=Math.round((Date.now()-c.t0)/1000);
  sessions.unshift({
    id:uid(), ts:Date.now(), scene:c.scene.custom?c.custom.slice(0,24):c.scene.t, sceneId:c.scene.id,
    level:c.level, turns:mine.length, words:mine.reduce((a,m)=>a+wordCount(m.en),0), sec,
    char:c.char?c.char.name:'', mission:c.mission?c.mission.t:'', missionDone:!!c.missionDone,
    score:rep.score||null, cefr:rep.cefr||'', style:c.style||'normal', msgs:c.msgs.map(m=>({r:m.role,en:m.en,ja:m.ja||''})), report:rep
  });
  sessions=sessions.slice(0,120); save(LS.log,sessions);
  (rep.fixes||[]).forEach(f=>{
    if(!f.better) return;
    weak.unshift({id:uid(), cat:f.cat||'other', you:f.you||'', better:f.better, why_ja:f.why_ja||'', ts:Date.now(), scene:c.scene.t});
  });
  weak=weak.slice(0,300); save(LS.weak,weak);
  paintMsgs();
}
function localReport(c){
  const mine=c.msgs.filter(m=>m.role==='me');
  const words=mine.reduce((a,m)=>a+wordCount(m.en),0);
  const sc=c.scene;
  const phr=(sc.script||[]).flatMap(s=>s.hints||[]).slice(0,5);
  const avgw = mine.length? words/mine.length : 0;
  return {
    cefr: avgw<4?'A1':avgw<6?'A2':avgw<9?'B1':avgw<13?'B2':'C1',
    cefr_why_ja:`1回あたり平均${avgw.toFixed(1)}語で話していました（AIキーを入れると中身まで見て判定します）`,
    score: Math.min(100, 45+mine.length*5+Math.min(25,Math.round(words/3))),
    summary_ja:`${mine.length}回、合計${words}語を英語で話しました。まずは最後までやり切ったことが立派です。`,
    good_points:[`「${mine[0]?mine[0].en:''}」から会話を始められました`],
    fixes: mine.filter(m=>m.fb&&m.fb.status==='tip'&&m.fb.better).slice(0,3).map(m=>({you:m.en,better:m.fb.better,why_ja:m.fb.why_ja})),
    phrases: phr,
    next_goal_ja:'AIキーを設定すると、自分の言い方に合わせた本当の会話とアドバイスがもらえます。'
  };
}
function talkStats(c){
  const mine=c.msgs.filter(m=>m.role==='me');
  const words=mine.flatMap(m=>(m.en.toLowerCase().match(/[a-z']+/g)||[]));
  const uniq=new Set(words);
  const longest=mine.reduce((a,m)=>Math.max(a,wordCount(m.en)),0);
  return {turns:mine.length, words:words.length, uniq:uniq.size,
          avg: mine.length? (words.length/mine.length) : 0, longest};
}

/* --- 発音チェック：認識結果とお手本を単語ごとに突き合わせる --- */
const normWords = t=>String(t||'').toLowerCase().replace(/[^a-z' ]/g,' ').split(/\s+/).filter(Boolean);
function pronScore(target, said){
  const a=normWords(target), b=normWords(said);
  if(!a.length) return {rate:0, marks:[]};
  // 最長共通部分列で「言えた単語」を対応づける
  const dp=Array.from({length:a.length+1},()=>new Array(b.length+1).fill(0));
  for(let i=a.length-1;i>=0;i--) for(let j=b.length-1;j>=0;j--)
    dp[i][j]= a[i]===b[j]? dp[i+1][j+1]+1 : Math.max(dp[i+1][j],dp[i][j+1]);
  const marks=[]; let i=0,j=0;
  while(i<a.length){
    if(j<b.length && a[i]===b[j]){ marks.push({w:a[i],ok:true}); i++; j++; }
    else if(j<b.length && dp[i+1][j]>=dp[i][j+1]){ marks.push({w:a[i],ok:false}); i++; }
    else if(j<b.length){ j++; }
    else { marks.push({w:a[i],ok:false}); i++; }
  }
  const ok=marks.filter(x=>x.ok).length;
  return {rate:Math.round(ok/a.length*100), marks, said:b.join(' ')};
}
function pronHtml(r){
  return `<div style="font-size:15px;line-height:2">
    ${r.marks.map(m=>`<span style="padding:2px 6px;border-radius:7px;margin-right:3px;background:${m.ok?'color-mix(in srgb,var(--ok) 18%,transparent)':'color-mix(in srgb,var(--danger) 18%,transparent)'};color:${m.ok?'var(--ok)':'var(--danger)'};font-weight:${m.ok?600:700}">${esc(m.w)}</span>`).join('')}
  </div>
  <div class="muted" style="font-size:12px;margin-top:6px">聞き取られた音：「${esc(r.said||'（無音）')}」</div>`;
}

/* ---------- 11.2 フレーズ帳（間隔反復＋発音チェック） ---------- */
let phMode='list', phQuery='';
const QMODES=[
 {id:'mix', t:'おまかせ', d:'3種類を混ぜて出す'},
 {id:'ja2en', t:'日本語→英語', d:'意味を見て英語で言う'},
 {id:'listen', t:'🎧 聞き取り', d:'音だけ聞いて意味を答える'},
 {id:'speak', t:'🎤 発音', d:'お手本と同じに言えるか'}
];
function renderPhrases(m){
  $('#hTitle').textContent='📒 フレーズ帳';
  const due=dueList();
  $('#hSub').textContent=phrases.length? `${phrases.length}個 ／ 覚えた ${learned()}個 ／ 今日 ${due.length}個` : '会話のふりかえりから追加できます';
  if(!phrases.length){ m.innerHTML=`<div class="empty">まだフレーズがありません。<br>会話のあとのふりかえりで「📒 フレーズ帳に入れる」を押すとたまります。</div>`; return; }
  if(phMode==='quiz'){ renderQuiz(m); return; }

let quiz=null;
function modeFor(p){
  if(cfg.quizMode!=='mix') return cfg.quizMode;
  const r=(p.seen||0)%3;
  return ['ja2en','listen','speak'][r];
}
function renderQuiz(m){
  if(quiz.i>=quiz.list.length){
    const rate=Math.round(quiz.right/quiz.list.length*100);
    m.innerHTML=`<div class="card" style="text-align:center">
      <h2>おつかれさま！</h2>
      <div style="font-size:36px;font-weight:800">${quiz.right} / ${quiz.list.length}</div>
      <div class="bar" style="margin:8px 0 4px"><i style="width:${rate}%"></i></div>
      <p class="muted">${rate>=80?'よく覚えています。この調子！':rate>=50?'半分は入っています。間違えたぶんは近いうちにまた出ます。':'まだ定着していません。明日また出てきます。'}</p>
      <p class="muted">${esc(nextDueLabel())}</p>

      <button class="btn ghost block" id="qback" style="margin-top:8px">一覧にもどる</button></div>`;

    $('#qback').onclick=()=>{ quiz=null; phMode='list'; prTab='srs'; render(); };

  }

  const head=`<div class="row"><div class="muted grow">${esc(quiz.label)} ${quiz.i+1} / ${quiz.list.length}　${mode==='speak'?'🎤 発音':mode==='listen'?'🎧 聞き取り':'✍️ 日本語→英語'}</div></div>
   <div class="bar" style="margin-bottom:4px"><i style="width:${quiz.i/quiz.list.length*100}%"></i></div>`;
  const next=(correct)=>{ srsAnswer(p,correct); save(LS.ph,phrases); if(correct) quiz.right++; quiz.i++; quiz.open=false; quiz.pron=null; quiz.phase='q'; render(); };

  if(mode==='speak'){
    const pr=quiz.pron;
    m.innerHTML=head+`
     <div class="card" style="text-align:center;padding:22px 16px">
       <div style="font-size:13px;color:var(--sub)">お手本と同じように言ってみよう</div>
       <div style="font-size:19px;font-weight:700;margin:10px 0 6px">${esc(p.en)}</div>
       <div class="muted" style="font-size:12.5px">${esc(p.ja)}</div>
       <div class="row" style="justify-content:center;margin-top:14px">
         <button class="btn soft sm" id="say">🔊 お手本</button>
         <button class="btn soft sm" id="slow">🐢 ゆっくり</button>
       </div>
       <button class="mic" id="pmic" style="margin:16px auto 0">🎙</button>
       <div class="muted" style="font-size:12px;margin-top:8px" id="pmsg">マイクを押して声に出してみましょう</div>
       ${pr?`<div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line)">
          <div style="font-size:30px;font-weight:800;color:${pr.rate>=80?'var(--ok)':pr.rate>=50?'var(--warn)':'var(--danger)'}">${pr.rate}%</div>
          <div class="muted" style="font-size:12px;margin-bottom:8px">${pr.rate>=80?'しっかり伝わる発音です':pr.rate>=50?'惜しい。赤い単語をもう一度':'ゆっくりでいいので区切って言ってみて'}</div>
          ${pronHtml(pr)}
        </div>`:''}
     </div>
     ${pr?`<div class="row"><button class="btn ghost grow" id="ng">もう一度</button><button class="btn grow" id="ok">次へ</button></div>`:''}
     <button class="btn ghost block" id="qskip">この問題をとばす</button>
     <button class="btn ghost block" id="qback">やめる</button>`;
    $('#say').onclick=()=>speak(p.en);
    $('#slow').onclick=()=>speak(p.en,Math.max(0.55,cfg.rate-0.25));
    $('#pmic').onclick=()=>{
      const b=$('#pmic');
      if(b.classList.contains('rec')){ stopRec(); return; }
      b.classList.add('rec'); $('#pmsg').textContent='聞いています…';
      startRec('en-US',
        fin=>{ quiz.pron=pronScore(p.en,fin); render(); },
        itr=>{ const el=$('#pmsg'); if(el) el.textContent='「'+itr+'」'; },
        ()=>{ const el=$('#pmic'); if(el) el.classList.remove('rec'); });
    };
    if(pr){ $('#ok').onclick=()=>next(pr.rate>=70); $('#ng').onclick=()=>{ quiz.pron=null; render(); }; }
    $('#qskip').onclick=()=>{ quiz.i++; quiz.pron=null; render(); };
    $('#qback').onclick=()=>{ quiz=null; phMode='list'; prTab='srs'; render(); };
    return;
  }

  const isListen = mode==='listen';
  m.innerHTML=head+`
   <div class="card" style="text-align:center;padding:26px 16px">
     <div style="font-size:13px;color:var(--sub)">${isListen?'聞こえた英語の意味は？':'これを英語で言うと？'}</div>
     ${isListen
       ? `<button class="btn soft" id="play" style="margin:16px auto 6px">🔊 もう一度聞く</button>
          <div class="muted" style="font-size:12px">${quiz.open?'':'まず声に出して言ってみてから答えを見よう'}</div>`
       : `<div style="font-size:19px;font-weight:700;margin:10px 0 18px">${esc(p.ja||p.scene||'（訳なし）')}</div>`}
     ${quiz.open?`<div style="font-size:20px;font-weight:800;color:var(--accent);margin-top:12px">${esc(p.en)}</div>
       <div class="muted" style="margin-top:4px">${esc(p.ja)}</div>
       <button class="btn soft sm" id="say" style="margin-top:10px">🔊 聞く</button>`
      :`<button class="btn block" id="open" style="margin-top:14px">答えを見る</button>`}
   </div>
   ${quiz.open?`<div class="row"><button class="btn ghost grow" id="ng">まだ</button><button class="btn grow" id="ok">言えた</button></div>`:''}
   <button class="btn ghost block" id="qback">やめる</button>`;
  if(isListen && !quiz.open && quiz.phase==='q'){ quiz.phase='played'; speak(p.en); }
  const pl=$('#play'); if(pl) pl.onclick=()=>speak(p.en);
  if(quiz.open){
    $('#say').onclick=()=>speak(p.en);
    $('#ok').onclick=()=>next(true);
    $('#ng').onclick=()=>next(false);
    if(!isListen) speak(p.en);
  }else{
    $('#open').onclick=()=>{ quiz.open=true; render(); };
  }
  $('#qback').onclick=()=>{ quiz=null; phMode='list'; prTab='srs'; render(); };
}

/* ---------- 11.5 弱点ノート ---------- */
const CATS={tense:'時制（過去・現在完了など）',article:'冠詞（a / the）',preposition:'前置詞（in / on / at）',
 'word-order':'語順',plural:'単数・複数',vocab:'単語の選び方',expression:'言い回しが不自然',
 question:'疑問文の作り方',other:'その他'};
const CAT_TIP={tense:'「いつの話か」を先に決めてから動詞を選ぶと安定します。',
 article:'初めて出す名詞は a、相手も知っているものは the。数えられない名詞は付けない。',
 preposition:'場所は「点=at / 面=on / 中=in」、時間は「時刻=at / 曜日=on / 月・年=in」。',
 'word-order':'英語は「だれが→どうする→何を→どこで→いつ」の順が基本。',
 plural:'数えられる名詞が2つ以上なら s。a と s は同時に付かない。',
 vocab:'辞書の1番目の意味に飛びつかず、場面ごと覚えるのが近道。',
 expression:'単語は合っていても言い方が不自然。まるごと言い回しで覚えましょう。',
 question:'疑問文は「Do / Did / Are」などを先頭に。語順が入れ替わります。',
 other:'まずは通じることを優先してOKです。'};
function weakTop(days){
  const from=days? Date.now()-days*DAY : 0;
  const c={};
  weak.filter(w=>w.ts>=from).forEach(w=>{ c[w.cat]=(c[w.cat]||0)+1; });
  return Object.entries(c).sort((a,b)=>b[1]-a[1]);
}
function avgScore(n){
  const ss=sessions.filter(s=>s.score!=null).slice(0,n||5);
  return ss.length? Math.round(ss.reduce((a,s)=>a+s.score,0)/ss.length) : null;
}
function levelSuggestion(){
  if(!cfg.autoLevel) return null;
  const a=avgScore(5);
  if(a==null || sessions.filter(s=>s.score!=null).length<3) return null;
  const i=LEVELS.findIndex(l=>l.id===cfg.level);
  if(a>=88 && i<LEVELS.length-1) return {to:LEVELS[i+1], why:`直近5回の平均が ${a}点。余裕がありそうです`, up:true};
  if(a<=58 && i>0) return {to:LEVELS[i-1], why:`直近5回の平均が ${a}点。少し背伸びしすぎかもしれません`, up:false};
  return null;
}

  const lu=$('#lvUp'); if(lu) lu.onclick=()=>{ const sg=levelSuggestion(); if(sg){ cfg.level=sg.to.id; saveCfg(); toast('むずかしさを「'+sg.to.t+'」にしました'); render(); } };
  const wo=$('#weakOpen'); if(wo) wo.onclick=()=>{ openWeak=!openWeak; render(); };
  m.querySelectorAll('[data-sayt]').forEach(b=>b.onclick=()=>speak(b.dataset.sayt));
  m.querySelectorAll('[data-wkeep]').forEach(b=>b.onclick=()=>{ const w=weak.find(x=>x.id===b.dataset.wkeep); if(w) addPhrase(w.better,w.why_ja||'','弱点ノート'); });
  m.querySelectorAll('[data-op]').forEach(b=>b.onclick=()=>{ openSession = openSession===b.dataset.op? null : b.dataset.op; render(); });
  m.querySelectorAll('[data-del2]').forEach(b=>b.onclick=()=>{ sessions=sessions.filter(s=>s.id!==b.dataset.del2); save(LS.log,sessions); openSession=null; render(); });
}

/* ---------- 13. 設定 ---------- */
function renderSettings(m){
  $('#hTitle').textContent='⚙️ 設定';
  $('#hSub').textContent='キーは この端末の中だけ に保存されます';
  loadVoices();
  m.innerHTML=`
  <div class="card">
    <h2>🔑 AIキー（Google AI Studio・無料）</h2>
    <p class="muted" style="margin:0 0 8px">
      ① <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a> を開く<br>
      ② Googleでログイン →「Create API key」<br>
      ③ 出てきた <code>AIza…</code> をコピーして下に貼る<br>
      クレジットカードの登録はいりません。無料枠だけで毎日たっぷり会話できます。
    </p>
    <input class="f" id="key" type="password" placeholder="AIza..." value="${esc(cfg.apiKey)}" autocomplete="off">
    <div class="row" style="margin-top:8px">
      <button class="btn grow" id="saveKey">保存して確認</button>
      <button class="btn ghost" id="clrKey">消す</button>
    </div>
    <div id="keyMsg" class="muted" style="margin-top:8px">${hasKey()?'✅ 設定済み（AIモード）':'未設定（台本モードで動きます）'}</div>
    <label class="f">モデル</label>
    <select class="f" id="model">
      <option value="gemini-2.5-flash">gemini-2.5-flash（おすすめ・賢い）</option>
      <option value="gemini-2.5-flash-lite">gemini-2.5-flash-lite（速い・上限が緩い）</option>
      <option value="gemini-flash-latest">gemini-flash-latest（最新）</option>
    </select>
  </div>

  <div class="card">
    <h2>🔊 声と話し方</h2>
    <label class="f">相手の声</label>
    <select class="f" id="voice">
      <option value="">自動でえらぶ</option>
      ${voices.map(v=>`<option value="${esc(v.voiceURI)}">${esc(v.name)} (${esc(v.lang)})</option>`).join('')}
    </select>
    <label class="f">話す速さ　<span id="rateV">${cfg.rate.toFixed(2)}</span></label>
    <input class="f" id="rate" type="range" min="0.6" max="1.2" step="0.02" value="${cfg.rate}">
    <button class="btn ghost block sm" id="test" style="margin-top:6px">🔊 この声で聞いてみる</button>
    ${voices.length?'':'<p class="muted" style="margin-top:8px">※ 声の一覧が空のときは、一度どこかをタップしてからこの画面を開き直してください。</p>'}
  </div>

  <div class="card">
    <h2>会話のしかた</h2>
    <div class="sw"><div class="l">相手のセリフを自動で読み上げる<small>オフにすると🔊ボタンだけで再生</small></div>
      <button class="toggle ${cfg.autoSpeak?'on':''}" data-t="autoSpeak"></button></div>
    <div class="sw"><div class="l">ハンズフリー（連続会話）<small>相手が話し終わったら、自動でマイクが入ります</small></div>
      <button class="toggle ${cfg.handsFree?'on':''}" data-t="handsFree"></button></div>
    <div class="sw"><div class="l">話し終わったら自動で送信<small>オフにすると内容を直してから送れます</small></div>
      <button class="toggle ${cfg.autoSend?'on':''}" data-t="autoSend"></button></div>
    <label class="f">何秒だまったら「話し終わり」とみなすか　<span id="silV">${cfg.silence.toFixed(1)}秒</span></label>
    <input class="f" id="silence" type="range" min="2" max="10" step="0.5" value="${cfg.silence}">
    <p class="muted" style="margin:4px 0 0;font-size:11.5px">長くすると、言葉に詰まっても勝手に送信されません。まだ一度も声を出していないときは、これ＋2.5秒（最低7秒）待ちます。</p>
    <div class="sw"><div class="l">日本語訳を最初から表示<small>オフだと「日本語で見る」を押したときだけ</small></div>
      <button class="toggle ${cfg.showJa?'on':''}" data-t="showJa"></button></div>
    <label class="f">1回の会話の長さ（自分が話す回数の目安）</label>
    <input class="f" id="turns" type="number" min="3" max="30" value="${cfg.turns}">
    <label class="f">1日の目標（自分が話す回数）</label>
    <input class="f" id="goal" type="number" min="1" max="200" value="${cfg.goal}">
    <div class="sw" style="margin-top:6px"><div class="l">レベルの上げ下げを提案する<small>直近5回の平均点から判断します</small></div>
      <button class="toggle ${cfg.autoLevel?'on':''}" data-t="autoLevel"></button></div>
    <label class="f">呼んでほしい名前（任意）</label>
    <input class="f" id="name" placeholder="Shu" value="${esc(cfg.name)}">
  </div>

  <div class="card">
    <h2>📊 無料枠の使いかた</h2>
    <div class="stat" style="margin-bottom:10px">
      <div><b>${useToday()}</b><span>今日つかった回数</span></div>
      <div><b>${useMinute()}</b><span>この1分</span></div>
      <div><b>${Math.max(0,limit().rpd-useToday())}</b><span>今日の残り目安</span></div>
    </div>
    <div class="bar"><i style="width:${Math.min(100,useToday()/limit().rpd*100)}%"></i></div>
    <p class="muted" style="margin:8px 0 10px">いまのモデル <b>${esc(cfg.model)}</b> の無料枠の目安：<b>1分に${limit().rpm}回</b>／<b>1日に${limit().rpd}回</b></p>
    <p class="muted" style="margin:0 0 10px">
      <b>何回ぶん使うの？</b><br>
      ・あなたが1回話す → <b>1回</b>／・ヒントを出す → <b>1回</b>／・日本語→英語 → <b>1回</b>／・終わりのレポート → <b>1回</b><br>
      つまり <b>8往復の会話ぜんぶで だいたい10回</b>。1日に250回なら <b>25会話くらい</b>できます。ふつうに練習するぶんには、まず足りなくなりません。
    </p>
    <p class="muted" style="margin:0">
      上限を超えても<b>お金は一切かかりません</b>。「今は使えません」と断られるだけで、少し待つか翌日になれば元に戻ります。
      上の数字はこのアプリが数えた目安です。Googleが決めた本当の枠は
      <a href="https://aistudio.google.com/rate-limit" target="_blank" rel="noopener">AI Studio の Rate limits</a> で確認できます（アカウントによって少し違います）。
      足りないときは設定のモデルを <b>flash-lite</b> にすると枠が広がります。
    </p>
  </div>

  <div class="card">
    <h2>データ</h2>
    <p class="muted" style="margin:0 0 10px">会話の記録・フレーズ帳・キーは、すべてこの端末のブラウザ内だけに保存されます。外部には送られません（AIモードのときだけ、会話文がGoogleに送られます）。</p>
    <div class="row"><button class="btn ghost grow sm" id="exp">バックアップを保存</button>
      <button class="btn ghost grow sm" id="imp">復元する</button></div>
    <button class="btn danger block sm" id="wipe" style="margin-top:10px">すべて消す</button>
    <input type="file" id="file" accept="application/json" class="hidden">
  </div>
  <p class="muted" style="text-align:center;padding-bottom:20px">Talkie ・ 完全無料 ・ オフラインでも台本モードは動きます</p>`;

  $('#model').value=cfg.model;
  $('#voice').value=cfg.voiceURI;
  $('#saveKey').onclick=async()=>{
    cfg.apiKey=$('#key').value.trim(); saveCfg();
    if(!cfg.apiKey){ $('#keyMsg').textContent='未設定（台本モードで動きます）'; return; }
    $('#keyMsg').textContent='確認中…';
    try{ await gemini({contents:[{role:'user',parts:[{text:'Say OK'}]}],temp:0});
      $('#keyMsg').textContent='✅ つながりました！AIモードで会話できます'; toast('AIモードになりました');
    }catch(e){ $('#keyMsg').textContent='⚠️ '+e.message; }
  };
  $('#clrKey').onclick=()=>{ cfg.apiKey=''; saveCfg(); render(); };
  $('#model').onchange=e=>{ cfg.model=e.target.value; saveCfg(); };
  $('#voice').onchange=e=>{ cfg.voiceURI=e.target.value; saveCfg(); speak('Hi! How are you doing today?'); };
  $('#rate').oninput=e=>{ cfg.rate=parseFloat(e.target.value); $('#rateV').textContent=cfg.rate.toFixed(2); saveCfg(); };
  $('#test').onclick=()=>speak("Hi there! What can I get started for you today?");
  m.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{ cfg[b.dataset.t]=!cfg[b.dataset.t]; saveCfg(); render(); });
  $('#silence').oninput=e=>{ cfg.silence=parseFloat(e.target.value); $('#silV').textContent=cfg.silence.toFixed(1)+'秒'; saveCfg(); };
  $('#turns').onchange=e=>{ cfg.turns=Math.max(3,Math.min(30,+e.target.value||8)); saveCfg(); };
  $('#goal').onchange=e=>{ cfg.goal=Math.max(1,Math.min(200,+e.target.value||12)); saveCfg(); };
  $('#name').onchange=e=>{ cfg.name=e.target.value.trim(); saveCfg(); };
  $('#exp').onclick=()=>{
    const blob=new Blob([JSON.stringify({cfg:{...cfg,apiKey:''},sessions,phrases,weak},null,1)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download='talkie-backup-'+todayKey()+'.json'; a.click(); URL.revokeObjectURL(a.href);
  };
  $('#imp').onclick=()=>$('#file').click();
  $('#file').onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{ try{
      const d=JSON.parse(r.result);
      if(d.sessions){ sessions=d.sessions; save(LS.log,sessions); }
      if(d.phrases){ phrases=d.phrases.map(srsInit); save(LS.ph,phrases); }
      if(d.weak){ weak=d.weak; save(LS.weak,weak); }
      if(d.cfg){ Object.assign(cfg,d.cfg,{apiKey:cfg.apiKey}); saveCfg(); }
      toast('復元しました'); render();
    }catch(err){ toast('ファイルを読めませんでした'); } };
    r.readAsText(f);
  };
  $('#wipe').onclick=()=>{ if(confirm('会話の記録・フレーズ帳・キーをすべて消します。よろしいですか？')){
    localStorage.removeItem(LS.log); localStorage.removeItem(LS.ph); localStorage.removeItem(LS.cfg);
    localStorage.removeItem(LS.weak); localStorage.removeItem(LS.use);
    location.reload(); } };
}

/* ---------- 14. 起動 ---------- */
window.addEventListener('beforeunload',e=>{ if(app.chat && !app.chat.ended){ e.preventDefault(); e.returnValue=''; } });
document.addEventListener('visibilitychange',()=>{ if(document.hidden) stopSpeak(); });
if('serviceWorker' in navigator && location.protocol==='https:'){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
render();
</script>
</body>
</html>
